services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: company
      POSTGRES_PASSWORD: company_local
      POSTGRES_DB: company
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U company -d company']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
